name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build yorbo
        run: cargo build --release --locked -p yorbo

      - name: Build installer
        run: cargo build --release --locked -p installer

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yorbo-binaries-${{ github.sha }}
          path: |
            target/release/yorbo.exe
            target/release/installer.exe
          if-no-files-found: error
