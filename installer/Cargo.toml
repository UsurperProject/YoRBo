[package]
name = "installer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
commons = { version = "0.1.0", path = "../commons" }
confy = "2.0.0"
rfd = "0.17.2"
serde = {version = "1.0.229", features = ["derive"]}
serde_json = "1.0.154"
slint = "1"
ureq = "3.5.0"
uuid = { version = "1.29.0", features = ["serde"] }
winreg = "0.56.0"
zip = { version = "9", default-features = false, features = ["deflate"] }

[build-dependencies]
slint-build = "1"
embed-manifest = "1.5.1"
winresource = "0.1.34"
